application.config.path=src/main/resources/config.yaml

kafka.source=RegelBekraftaBeslut
kafka.subtopic=bekraftabeslut

# Container image configuration
quarkus.container-image.build=true
quarkus.container-image.name=rimfrost-regel-bekraftabeslut
quarkus.container-image.tag=latest
quarkus.container-image.group=rimfrost
quarkus.container-image.push=false

#
# Incoming messages
#

# regel-requests

%prod.mp.messaging.incoming.regel-requests.connector=smallrye-kafka
%prod.mp.messaging.incoming.regel-requests.topic=bekraftabeslut-requests
%prod.mp.messaging.incoming.regel-requests.value.deserializer=se.fk.rimfrost.framework.regel.presentation.kafka.RegelRequestDeserializer
%prod.mp.messaging.incoming.regel-requests.auto.offset.reset=earliest

%dev.mp.messaging.incoming.regel-requests.connector=smallrye-kafka
%dev.mp.messaging.incoming.regel-requests.topic=bekraftabeslut-requests
%dev.mp.messaging.incoming.regel-requests.value.deserializer=se.fk.rimfrost.framework.regel.presentation.kafka.RegelRequestDeserializer
%dev.mp.messaging.incoming.regel-requests.auto.offset.reset=earliest

%test.mp.messaging.incoming.regel-requests.connector=smallrye-in-memory
%test.mp.messaging.incoming.regel-requests.topic=bekraftabeslut-requests
